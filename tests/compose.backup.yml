# Disposable backup and restore check: test-only secrets, synthetic data only, no platform network.
name: dlc-infra-mongo-backup-test
x-mongo-image: &mongo-image mongo:8.0.32@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2

services:
  test-secrets:
    image: *mongo-image
    volumes:
      - test-secrets:/secrets
    entrypoint:
      - sh
      - -c
      - >-
        openssl rand -hex 24 > /secrets/root && openssl rand -hex 24 > /secrets/migrator && openssl rand -hex 24 > /secrets/backup &&
        openssl rand -base64 756 > /secrets/keyfile && chown -R mongodb:mongodb /secrets && chmod 400 /secrets/*

  mongo:
    image: *mongo-image
    depends_on:
      test-secrets:
        condition: service_completed_successfully
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /secrets/root
    volumes:
      - test-secrets:/secrets:ro
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/secrets/keyfile"]

  backup-check:
    image: *mongo-image
    depends_on:
      mongo:
        condition: service_started
    environment:
      DLC_MONGO_HOST: mongo:27017
      DLC_MONGO_REPLICA_SET: rs0
      DLC_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      DLC_MONGO_ROOT_USER: root
      DLC_MONGO_ROOT_PASSWORD_FILE: /secrets/root
      DLC_CLINICAL_MIGRATOR_PASSWORD_FILE: /secrets/migrator
      DLC_CLINICAL_BACKUP_PASSWORD_FILE: /secrets/backup
      DLC_BACKUP_PASSWORD_FILE: /secrets/backup
      DLC_BACKUP_DIR: /backups
    volumes:
      - test-secrets:/secrets:ro
      - test-backups:/backups
      - ../scripts:/scripts:ro
      - ./:/checks:ro
    entrypoint: ["/bin/sh", "/checks/run-backup-check.sh"]

volumes:
  test-secrets:
  test-backups:
